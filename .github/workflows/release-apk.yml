name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Rename APK
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/accessible-reader-android12.apk
        
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.0-${{ steps.date.outputs.date }}
        release_name: Accessible Reader v1.0.0 - Android 12+ Compatible
        body: |
          # Accessible Reader - Screen Reader for Android
          
          ## Features
          - ✅ Full screen reading with TalkBack-style functionality
          - ✅ Voice control and voice commands
          - ✅ Touch exploration mode
          - ✅ Gesture navigation
          - ✅ Text-to-Speech (TTS) support
          - ✅ Voice dictation
          
          ## Compatibility
          - **Minimum Android Version**: Android 12 (API 31)
          - **Target Android Version**: Android 14 (API 34)
          - **Architectures**: ARM, ARM64, x86, x64
          
          ## Installation
          1. Download the APK below
          2. Enable "Install from Unknown Sources" in Android Settings
          3. Install the APK
          4. Open the app and enable the accessibility service
          
          ## How to Enable
          1. Open Accessible Reader app
          2. Tap "Enable Screen Reader"
          3. Find "Accessible Reader" in Accessibility Settings
          4. Toggle it ON
          5. Confirm permissions
          
          ## Voice Commands
          - "Go back" - Navigate back
          - "Go home" - Go to home screen
          - "Recent apps" - Open recent apps
          - "Notifications" - Open notifications
          - "Read screen" - Read current screen content
          - "Stop speaking" - Stop speech output
          - And many more!
          
          ## Source Code
          Full source code is available in this repository.
          
          ---
          Built with Flutter | Inspired by Google TalkBack
        draft: false
        prerelease: false
        
    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/app/outputs/flutter-apk/accessible-reader-android12.apk
        asset_name: accessible-reader-android12.apk
        asset_content_type: application/vnd.android.package-archive
