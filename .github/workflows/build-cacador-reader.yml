name: Compilar Caçador Reader (Android)

on:
  push:
    branches: [master]
    paths:
      - 'cacador-reader/**'
      - '.github/workflows/build-cacador-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Compilar APK de depuração
        working-directory: cacador-reader
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: cacador-reader-debug-apk
          path: cacador-reader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
