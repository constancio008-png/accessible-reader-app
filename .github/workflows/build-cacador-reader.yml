name: Compilar Lume (Android)

on:
  push:
    branches: [master]
    paths:
      - 'cacador-reader/**'
      - '.github/workflows/build-cacador-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only build the newest pushed revision; older runs can otherwise publish stale APKs.
concurrency:
  group: lume-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar pacotes do Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compilar APK de depuração
        working-directory: cacador-reader
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: lume-debug-apk
          path: cacador-reader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
